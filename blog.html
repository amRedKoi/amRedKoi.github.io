<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="amRedKoi 的博客：记录技术、学习、生活与随笔，支持分类、标签与分页浏览。">
  <meta name="keywords" content="amRedKoi,个人博客,随笔,技术,学习笔记,前端,控制">
  <meta name="author" content="amRedKoi">
  <title>博客 · amRedKoi 个人小站</title>
  <link rel="canonical" href="https://amRedKoi.github.io/blog.html">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="amRedKoi 个人小站 RSS" href="feed.xml">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="amRedKoi 个人小站">
  <meta property="og:title" content="博客 · amRedKoi">
  <meta property="og:description" content="amRedKoi 的博客：技术、学习、生活与随笔。">
  <meta property="og:url" content="https://amRedKoi.github.io/blog.html">
  <meta property="og:image" content="https://amRedKoi.github.io/assets/images/hero-bg.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="blog">

  <!-- 顶部导航：文章 / 动态 / 回到主站 -->
  <header class="topbar">
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="sidebar">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-menu"></use></svg>
    </button>
    <a class="brand" href="index.html">
      <svg class="logo" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-code"></use></svg>
      <span class="brand-text">amRedKoi</span>
    </a>

    <nav class="top-nav" aria-label="主导航">
      <a href="index.html">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-home"></use></svg>
        <span>首页</span>
      </a>
      <a href="blog.html" class="active">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-book"></use></svg>
        <span>博客</span>
      </a>
      <a href="resources.html">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-box"></use></svg>
        <span>资源</span>
      </a>
      <a href="about.html">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-user"></use></svg>
        <span>关于</span>
      </a>
    </nav>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到深色模式">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-moon"></use></svg>
      <span class="label">深色模式</span>
    </button>
  </header>

  <div class="layout">
    <!-- 左侧栏：个人卡片（与其他页面保持一致，便于统一维护） -->
    <aside class="sidebar" id="sidebar">
      <div class="side-profile">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/99656385?v=4&size=128" alt="amRedKoi 的头像">
        <h2 class="side-name">amRedKoi</h2>
        <div class="social">
          <a class="social-btn" href="https://github.com/amRedKoi" target="_blank" rel="noopener" aria-label="GitHub">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-github"></use></svg>
          </a>
          <a class="social-btn" href="about.html" aria-label="关于我">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-user"></use></svg>
          </a>
          <a class="social-btn" href="mailto:jjjgml@qq.com" aria-label="联系我">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-mail"></use></svg>
          </a>
        </div>
      </div>
      <div class="daily-quote">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-lightbulb"></use></svg>
        <p class="daily-quote-text" id="daily-quote"></p>
      </div>
      <div class="footer-note">记录生活<br>与随笔分享</div>
    </aside>

    <!-- 右侧内容 -->
    <main class="content">
      <div class="container">

        <!-- 文章 / 动态 切换 + 分类 + 滚动通知 -->
        <div class="blog-subbar">
          <div class="blog-tabs" role="tablist" aria-label="博客内容切换">
            <button type="button" class="tab active" data-view="posts" role="tab" aria-selected="true">文章</button>
            <button type="button" class="tab" data-view="moments" role="tab" aria-selected="false">动态</button>
          </div>
          <div class="filters" id="blog-filters"></div>
          <div class="blog-notice">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-megaphone"></use></svg>
            <div class="notice-viewport">
              <div class="notice-track" id="notice-track" aria-label="站内通知"></div>
            </div>
          </div>
        </div>

        <div class="blog-main">

          <!-- 左：文章 / 动态 视图 -->
          <div class="blog-view">

            <!-- 文章视图（默认） -->
            <section id="view-posts" class="view-posts">
              <div class="posts-head">
                <span class="title">文章</span>
                <div class="search-wrap">
                  <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-search"></use></svg>
                  <input type="search" id="search-input" placeholder="搜索文章…" aria-label="搜索文章">
                </div>
              </div>
              <section class="posts" aria-label="文章列表"></section>
              <div class="empty">
                <p>没有找到匹配的文章，换个分类或关键词试试～</p>
              </div>
              <nav class="pagination" id="pagination" aria-label="文章分页"></nav>
            </section>

            <!-- 动态视图 -->
            <section id="view-moments" class="view-moments" hidden>
              <div class="moments-head">
                <span class="title">动态</span>
                <span class="moments-hint">随缘更新</span>
              </div>
              <div class="moments-list" id="moments"></div>
            </section>

          </div>

          <!-- 右：标签云 -->
          <aside class="blog-aside">
            <div class="tag-panel">
              <div class="tag-panel-head">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-tag"></use></svg>
                <h3>标签</h3>
              </div>
              <div class="tag-cloud" id="tag-cloud"></div>
            </div>
          </aside>

        </div>
      </div>
    </main>
  </div>

  <footer>
    <div class="container">© 2026 amRedKoi · 个人小站</div>
  </footer>

  <button class="back-to-top" id="back-to-top" type="button" aria-label="回到顶部">
    <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#icon-arrow-up"></use></svg>
  </button>

  <script src="assets/js/posts.js"></script>
  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
