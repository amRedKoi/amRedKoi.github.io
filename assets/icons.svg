    <path d="M9 18h6"/>
    <path d="M10 22h4"/>
  </symbol>

  <!-- Lucide: activity -->
  <symbol id="icon-activity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>
  </symbol>

  <!-- Lucide: sliders-horizontal -->
  <symbol id="icon-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="21" x2="14" y1="4" y2="4"/>
    <line x1="10" x2="3" y1="4" y2="4"/>
    <line x1="21" x2="12" y1="12" y2="12"/>
    <line x1="8" x2="3" y1="12" y2="12"/>
    <line x1="21" x2="16" y1="20" y2="20"/>
    <line x1="12" x2="3" y1="20" y2="20"/>
    <line x1="14" x2="14" y1="2" y2="6"/>
    <line x1="8" x2="8" y1="10" y2="14"/>
    <line x1="16" x2="16" y1="18" y2="22"/>
  </symbol>

  <!-- Lucide: target -->
  <symbol id="icon-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <circle cx="12" cy="12" r="6"/>
    <circle cx="12" cy="12" r="2"/>
  </symbol>

  <!-- Lucide: cpu -->
  <symbol id="icon-cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="16" rx="2"/>
    <rect x="9" y="9" width="6" height="6"/>
    <path d="M15 2v2"/>
    <path d="M15 20v2"/>
    <path d="M2 15h2"/>
    <path d="M2 9h2"/>
    <path d="M20 15h2"/>
    <path d="M20 9h2"/>
    <path d="M9 2v2"/>
    <path d="M9 20v2"/>
  </symbol>

  <!-- Lucide: git-branch -->
  <symbol id="icon-branch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" x2="6" y1="3" y2="15"/>
    <circle cx="18" cy="6" r="3"/>
    <circle cx="6" cy="18" r="3"/>
    <path d="M18 9a9 9 0 0 1-9 9"/>
  </symbol>
</svg>
